name: Deploy JupyterLite

on:
  push:
    branches: [main]
    paths:
      - 'machine_learning/**'
      - 'site-requirements.txt'
      - 'jupyter_lite_config.json'
      - 'overrides.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: site-requirements.txt
      - name: Install JupyterLite builder
        run: python -m pip install -r site-requirements.txt
      - name: Build static site
        run: jupyter lite build --contents machine_learning --output-dir dist
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
