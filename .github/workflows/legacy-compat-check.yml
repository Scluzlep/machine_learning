name: Legacy kernel build check (compat only)

on:
  # One initial, isolated run when this check is first added. Future runtime
  # updates never consume Actions minutes unless explicitly re-dispatched.
  push:
    branches:
      - compat/pyodide-legacy-course
    paths:
      - '.github/workflows/legacy-compat-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned legacy JupyterLite builder
        run: python -m pip install -r site-requirements.txt
      - name: Patch 0.1.1 kernel and test untouched Notebooks
        run: |
          KERNEL_WHEEL="$(python - <<'PY'
          import sys
          from pathlib import Path
          matches=list(Path(sys.prefix).rglob('pyodide_kernel-0.1.1-*.whl'))
          assert len(matches)==1, f'Unexpected kernel wheels: {matches}'
          print(matches[0])
          PY
          )"
          python tools/ml_kernel/build_custom_kernel.py "$KERNEL_WHEEL" --output .ml-wheel
          python tests/test-notebook-integrity.py
          python tests/test-kernel-transform.py
          python tests/test-imports-bootstrap.py
          python tests/test-legacy-versions.py
          python tools/ml_kernel/stage_notebooks.py --site-base /machine_learning
          python tests/test-notebook-integrity.py --staged .ml-contents
      - name: Bundle historical ipympl, ipywidgets and seaborn wheels
        run: |
          python - <<'PY'
          from importlib.metadata import version
          from pathlib import Path
          import subprocess, sys
          packages=[f'ipywidgets=={version("ipywidgets")}',
                    f'ipympl=={version("ipympl")}', 'seaborn==0.11.2',
                    'ipython==8.12.3']
          subprocess.run([sys.executable,'-m','pip','download','--no-deps',
                          '--only-binary=:all:','--dest','.ml-wheel',*packages],check=True)
          print('Bundled legacy wheels:',[p.name for p in Path('.ml-wheel').glob('*.whl')])
          PY
      - name: Compile isolated legacy JupyterLite frontend
        run: |
          jupyter lite build --contents .ml-contents --output-dir dist
          test -s dist/lab/index.html
          test -s dist/jupyter-lite.json
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('dist')
          assert (root/'pypi/all.json').is_file(), 'Piplite index absent: addon did not initialize'
          assert (root/'pypi/pyodide_kernel-0.1.1-py3-none-any.whl').is_file(), 'Patched kernel wheel not indexed'
          index=json.loads((root/'pypi/all.json').read_text())
          assert 'pyodide-kernel' in index, f'Missing pyodide kernel package from index: {sorted(index)}'
          data=json.loads((root/'jupyter-lite.json').read_text())
          print('Legacy JupyterLite base site built:', sorted(data.keys()))
          PY
      - name: Host version-matched Pyodide 0.23.4 WASM packages
        run: |
          npm install --prefix .pyodide-vendor --no-save --ignore-scripts --no-audit --no-fund pyodide@0.23.4
          python tools/ml_kernel/vendor_pyodide.py --dist dist --base-path /machine_learning
          python tests/test-legacy-versions.py --dist dist
      - name: Bundle legacy browser fonts and TensorFlow.js
        run: |
          python tools/ml_kernel/vendor_chinese_font.py --output dist/assets/fonts
          npm install --prefix .tfjs-vendor --no-save --ignore-scripts --no-audit --no-fund @tensorflow/tfjs@4.22.0 @tensorflow/tfjs-backend-webgpu@4.22.0
          mkdir -p dist/vendor
          cp .tfjs-vendor/node_modules/@tensorflow/tfjs/dist/tf.min.js dist/vendor/tf.min.js
          cp .tfjs-vendor/node_modules/@tensorflow/tfjs-backend-webgpu/dist/tf-backend-webgpu.min.js dist/vendor/tf-backend-webgpu.min.js
          cp machine_learning/browser_ml/course-losses.js dist/vendor/course-losses.js
          cp machine_learning/browser_ml/tfjs_bridge.py dist/vendor/tfjs_bridge.py
          cp machine_learning/browser_ml/tfjs_compat.py dist/vendor/tfjs_compat.py
          cp machine_learning/browser_ml/tfjs_tensor.py dist/vendor/tfjs_tensor.py
          cp machine_learning/browser_ml/tfjs_layers.py dist/vendor/tfjs_layers.py
      - name: Browser execution smoke tests for legacy kernel
        run: |
          npm install --prefix .browser-test --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          .browser-test/node_modules/.bin/playwright install chromium
          # Test the actual patched kernel bootstrap first. A direct
          # Pyodide probe alone cannot exercise JupyterLite's Piplite index.
          node tests/repl-zero-edit.cjs
          node tests/browser-smoke.cjs
          node tests/notebook-imports.cjs
          node tests/repl-widget.cjs
